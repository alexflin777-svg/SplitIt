# Гейт: ни одна ветка не вливается в main красной.
#
# До этого файла обязательный набор проверок из .agents/rules/antigravity2_core.md §1
# держался на дисциплине: его запускал человек, и забытый прогон был невидим.
#
# Здесь семь проверок из §1 минус две, которые в CI невозможны честно:
#   - `npm run build` собирает с настоящим .env.local, а секретов проекта в CI нет;
#     их отсутствие проверяет canary снаружи, на уже задеплоенном приложении;
#   - `npm run serve:out` — ручной smoke, у него нет кода возврата.
# Всё остальное здесь и обязано быть зелёным.
#
# Шаги идут по отдельности, хотя `npm test` через pretest повторяет unit и RLS:
# так падение видно по имени шага, а не в общем логе. Повтор стоит три секунды.

name: gate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Первая проверка — что проверки на месте.
      # 2026-08-10 скрипт lint был заменён на `echo "Lint disabled..."`, и шаг
      # «lint» ниже оставался зелёным при любом коде. Заглушку видно только
      # тем, кто откроет package.json. Теперь её видно гейту.
      - name: Гейт не подменён заглушкой
        run: |
          node -e "
            const s = require('./package.json').scripts || {};
            const required = ['lint', 'test:unit', 'test:rls', 'test'];
            const stub = /^\s*(echo|true|exit\s+0|:)\b/;
            let bad = 0;
            for (const k of required) {
              if (!s[k]) { console.error('Нет обязательного скрипта: ' + k); bad++; continue; }
              if (stub.test(s[k])) { console.error('Скрипт ' + k + ' подменён заглушкой: ' + s[k]); bad++; }
            }
            if (!/eslint/.test(s.lint || '')) { console.error('Скрипт lint не вызывает eslint: ' + s.lint); bad++; }
            if (bad) process.exit(1);
            console.log('Скрипты гейта на месте.');
          "

      - name: Установить зависимости
        run: npm ci

      - name: lint
        run: npm run lint

      - name: Типы
        run: npx tsc --noEmit

      - name: Расчёты — unit
        run: npm run test:unit

      - name: RLS на настоящем PostgreSQL
        run: npm run test:rls

      # Проекты Playwright: mobile chromium (Pixel 5), desktop (Chrome) и
      # mobile safari (iPhone 13, WebKit). WebKit включается флагом PW_WEBKIT=1
      # — см. комментарий в playwright.config.ts. Ставим ровно эти движки.
      - name: Браузеры Playwright
        run: npx playwright install --with-deps chromium webkit

      # pretest пересобирает out/ с ПУСТЫМИ NEXT_PUBLIC_SUPABASE_* — то есть
      # E2E проверяют локальный/офлайн-режим и не зависят от окружения. Это
      # осознанный размен, но и его граница: сетевой режим (Supabase, Realtime,
      # приглашения между устройствами) здесь не покрыт вообще и проверяется
      # только verify:prod / verify:realtime / canary на живом проекте.
      - name: E2E на статическом экспорте
        run: npm test
        env:
          PW_WEBKIT: '1'

      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
